backend:
  name: waydroid-arm64
  type: container
  provider: waydroid
  architecture: aarch64
  nested_virtualization: false

runtime:
  native_arm: required
  kvm: not_required
  binder: required
  cgroups: required
  adb: required
  artifacts: enabled

limits:
  memory_mib: 4096
  cpu_shares: 1024

matrix:
  lifecycle: provision-start-test-collect-stop
  isolation: container

upstream:
  project: waydroid/waydroid
  revision: e7d73e7ff9d23003356d716e5a40fa5ca7ad17e0
